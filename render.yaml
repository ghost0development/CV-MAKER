services:
  - type: web
    name: CV-MAKER Backend
    runtime: node
    region: tokyo
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: SQLD_URL
        value: libsql://cv-maker-voicenotesite.aws-ap-northeast-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false

  - type: web
    name: CV-MAKER Frontend
    runtime: node
    region: tokyo
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0
    envVars:
      - key: VITE_API_URL
        value: https://srv-d8er9t1kh4rs73cboang.onrender.com
