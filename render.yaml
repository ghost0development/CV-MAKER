services:
  - type: web
    name: CV-MAKER
    runtime: node
    region: oregon
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.x
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SQLD_URL
        value: libsql://cv-maker-voicenotesite.aws-ap-northeast-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
